# .github/workflows/cmake-single-platform.yml
name: C++ Tests CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest] # можно добавить windows-latest, если нужно

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgtest-dev
          # Скачиваем и устанавливаем CMake новой версии, если нужно
          wget -q https://github.com/Kitware/CMake/releases/download/v3.24.2/cmake-3.24.2-linux-x86_64.tar.gz -O /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /opt
          echo "/opt/cmake-3.24.2-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Run Tests
        working-directory: ${{ github.workspace }}/build
        run: ctest -C Release --output-on-failure
